<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZHD Distributions</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="top-bar">
    <div class="logo">ZHD Distributions</div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search products..." />
    </div>

    <a class="whatsapp-btn" href="https://wa.me/447000000000" target="_blank">
      WhatsApp Order
    </a>
  </div>
</header>

<section class="hero">
  <h1>Wholesale Product Catalogue</h1>
  <p>150+ Products | 15+ Categories | Fast Ordering</p>
</section>

<section class="category-section">
  <div class="category-title">Browse Categories</div>

  <div class="category-buttons" id="categoryButtons">
    <button class="category-btn active" data-category="All">All</button>
    <button class="category-btn" data-category="Khakhra">Khakhra</button>
    <button class="category-btn" data-category="Snacks">Snacks</button>
    <button class="category-btn" data-category="Frozen">Frozen</button>
    <button class="category-btn" data-category="Drinks">Drinks</button>
    <button class="category-btn" data-category="Rice">Rice</button>
  </div>
</section>

<section class="products" id="productsContainer"></section>

<div class="floating-order" onclick="sendWhatsAppOrder()">
  Order on WhatsApp
</div>

<footer>
  © 2026 ZHD Distributions
</footer>

<script src="js/script.js"></script>
  
<div id="toast">
  Product added to cart
</div>
  
</body>
</html>
